aid: reggora
url: https://raw.githubusercontent.com/api-evangelist/reggora/refs/heads/main/apis.yml
name: Reggora
kind: company
description: Reggora is a modern appraisal management platform that connects mortgage
  lenders and appraisal vendors on a single system, automating the appraisal
  lifecycle from order placement and product selection through payment, document
  submission, revision review, and delivery back into the loan origination system
  (LOS). Reggora exposes a documented Lender API and Vendor API so lenders can
  manage 100% of their appraisal orders directly from their own LOS or proprietary
  tech stack. All key platform functionality is available via secure REST endpoints
  (JWT bearer token plus a per-integration API key), with sandbox and production
  environments and webhook callbacks for loan and order events. Endpoint paths in
  this catalog are modeled from Reggora's documented resource areas; the full
  reference is partner-facing at api.reggora.io/docs.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Appraisal Management
- Mortgage
- Lending
- Real Estate
- Valuation
- Loan Origination
- LOS Integration
- Fintech
