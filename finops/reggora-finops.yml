description: >-
  FinOps view of Reggora spend. Reggora is a contracted SaaS platform for
  mortgage lenders rather than a usage-metered public API, so the primary cost is
  a negotiated platform subscription plus the pass-through appraisal fees paid to
  vendors on each order (collected via Reggora appraisal payments). Reggora
  positions itself as a cost reducer, citing roughly $258 saved per loan from
  automating appraisal order management and quality control. The Lender API and
  Vendor API are included platform capabilities and are not separately invoiced
  per call. Appraisal vendors use the platform at no charge to them.
notes: >-
  No public per-unit API pricing is published; the subscription is negotiated
  with sales. The meaningful cost meters for a lender are the platform
  subscription and per-order appraisal fees, offset against automation savings.
  Reconcile actual contract terms with Reggora.
