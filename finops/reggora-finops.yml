meters:
- name: platform_subscription
  description: Negotiated platform subscription for the lender organization (includes Lender API access).
  unit: contract
  aggregation: sum
  dimensions:
  - account
- name: appraisal_orders
  description: Appraisal orders placed through the platform; each carries a vendor appraisal fee collected via Reggora payments.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - branch
  - product
- name: appraisal_fees
  description: Pass-through appraisal fees paid to vendors per order via Reggora appraisal payments.
  unit: USD
  aggregation: sum
  dimensions:
  - account
  - vendor
- name: automation_savings
  description: Reggora-cited cost avoided per loan from automating order management and QC (~$258/loan).
  unit: USD
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track appraisal orders, per-order vendor fees, and turn times per branch and product against the platform subscription.
- name: Allocation
  description: Map orders to branches, loan officers, and appraisal products so appraisal cost allocates to the originating team.
- name: Optimization
  description: Use automation, vendor selection, and quality-control workflows to cut per-file order-management and QC labor (the cited $44/file and $81/file).
- name: Accountability
  description: Assign owners per branch; review monthly appraisal spend and turn-time savings against the subscription cost.
